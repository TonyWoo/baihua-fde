<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="sans-serif">
  <defs>
    <marker id="arr15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="800" height="400" fill="#f5f8ff"/>
  <text x="400" y="36" font-size="20" fill="#1e3a5f" text-anchor="middle" font-weight="bold">反馈回路：现场经验怎么回总部</text>
  <g font-size="14" fill="#1e3a5f">
    <rect x="55" y="70" width="265" height="84" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="187" y="102" text-anchor="middle" font-weight="bold">现场发现问题</text>
    <text x="187" y="128" text-anchor="middle">接口缺字段、口径对不上</text>
    <rect x="480" y="70" width="265" height="84" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="612" y="102" text-anchor="middle" font-weight="bold">清单排序</text>
    <text x="612" y="128" text-anchor="middle">按影响几家客户、卡多深来排</text>
    <rect x="480" y="222" width="265" height="84" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="612" y="254" text-anchor="middle" font-weight="bold">总部产品团队</text>
    <text x="612" y="280" text-anchor="middle">通用问题做成平台功能</text>
    <rect x="55" y="222" width="265" height="84" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="187" y="254" text-anchor="middle" font-weight="bold">新版本回到现场</text>
    <text x="187" y="280" text-anchor="middle">所有客户一起受益</text>
  </g>
  <g stroke="#2563eb" stroke-width="2">
    <line x1="324" y1="112" x2="472" y2="112" marker-end="url(#arr15)"/>
    <line x1="612" y1="158" x2="612" y2="214" marker-end="url(#arr15)"/>
    <line x1="476" y1="264" x2="328" y2="264" marker-end="url(#arr15)"/>
    <line x1="187" y1="218" x2="187" y2="162" marker-end="url(#arr15)"/>
  </g>
  <text x="400" y="196" font-size="15" fill="#1e3a5f" text-anchor="middle" font-weight="bold">圈越转，定制越少</text>
  <text x="400" y="352" font-size="13" fill="#64748b" text-anchor="middle">只派人、不转圈，就会攒出几千个维护不起的定制版</text>
</svg>
