<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="800" height="340" fill="#f5f8ff"/>
  <text x="400" y="42" font-size="20" font-weight="bold" fill="#2563eb" text-anchor="middle">撤场不是断联：四段过渡安排</text>
  <rect x="30" y="90" width="170" height="130" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="120" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">最后一周</text>
  <text x="115" y="150" font-size="13" fill="#334155" text-anchor="middle">陪跑交接</text>
  <text x="115" y="176" font-size="13" fill="#334155" text-anchor="middle">王工主操作</text>
  <text x="115" y="202" font-size="13" fill="#334155" text-anchor="middle">陆远只旁站</text>
  <rect x="220" y="90" width="170" height="130" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="305" y="120" font-size="15" font-weight="bold" fill="#ea580c" text-anchor="middle">撤场后两周</text>
  <text x="305" y="150" font-size="13" fill="#334155" text-anchor="middle">答疑窗口</text>
  <text x="305" y="176" font-size="13" fill="#334155" text-anchor="middle">远程响应问题</text>
  <text x="305" y="202" font-size="13" fill="#334155" text-anchor="middle">只指导，不动手</text>
  <rect x="410" y="90" width="170" height="130" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="495" y="120" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">第一个月末</text>
  <text x="495" y="150" font-size="13" fill="#334155" text-anchor="middle">回访一次</text>
  <text x="495" y="176" font-size="13" fill="#334155" text-anchor="middle">看运行日志</text>
  <text x="495" y="202" font-size="13" fill="#334155" text-anchor="middle">复测评估集</text>
  <rect x="600" y="90" width="170" height="130" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="685" y="120" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">之后转常态</text>
  <text x="685" y="150" font-size="13" fill="#334155" text-anchor="middle">季度复盘</text>
  <text x="685" y="176" font-size="13" fill="#334155" text-anchor="middle">新场景再议</text>
  <text x="685" y="202" font-size="13" fill="#334155" text-anchor="middle">不再日常介入</text>
  <line x1="202" y1="155" x2="216" y2="155" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="392" y1="155" x2="406" y2="155" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="582" y1="155" x2="596" y2="155" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
  <text x="400" y="272" font-size="13" fill="#64748b" text-anchor="middle">过渡的目标，是让对方越来越不需要你</text>
  <text x="400" y="300" font-size="13" fill="#64748b" text-anchor="middle">一直被需要的交接，恰恰是没交干净的交接</text>
</svg>
