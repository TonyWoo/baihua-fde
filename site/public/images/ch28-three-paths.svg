<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430"><rect x="0" y="0" width="800" height="430" fill="#f5f8ff"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker></defs><text x="400" y="38" font-family="sans-serif" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="bold">三条转型路，各自缺什么</text><rect x="30" y="60" width="234" height="300" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="147" y="95" font-family="sans-serif" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="bold">工程师转型</text><text x="147" y="135" font-family="sans-serif" font-size="15" fill="#1e293b" text-anchor="middle">已有：写生产代码</text><text x="147" y="177" font-family="sans-serif" font-size="15" fill="#1e293b" text-anchor="middle">已有：系统排障经验</text><text x="147" y="219" font-family="sans-serif" font-size="15" fill="#ea580c" text-anchor="middle">缺：业务理解</text><text x="147" y="261" font-family="sans-serif" font-size="15" fill="#ea580c" text-anchor="middle">缺：面对客户沟通</text><text x="147" y="303" font-family="sans-serif" font-size="15" fill="#1e293b" text-anchor="middle">补：跟一线聊流程</text><rect x="283" y="60" width="234" height="300" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="400" y="95" font-family="sans-serif" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="bold">顾问转型</text><text x="400" y="135" font-family="sans-serif" font-size="15" fill="#1e293b" text-anchor="middle">已有：懂行业流程</text><text x="400" y="177" font-family="sans-serif" font-size="15" fill="#1e293b" text-anchor="middle">已有：会做汇报</text><text x="400" y="219" font-family="sans-serif" font-size="15" fill="#ea580c" text-anchor="middle">缺：动手写代码</text><text x="400" y="261" font-family="sans-serif" font-size="15" fill="#ea580c" text-anchor="middle">缺：生产系统经验</text><text x="400" y="303" font-family="sans-serif" font-size="15" fill="#1e293b" text-anchor="middle">补：亲手做小系统</text><rect x="536" y="60" width="234" height="300" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="653" y="95" font-family="sans-serif" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="bold">售前转型</text><text x="653" y="135" font-family="sans-serif" font-size="15" fill="#1e293b" text-anchor="middle">已有：会讲会演示</text><text x="653" y="177" font-family="sans-serif" font-size="15" fill="#1e293b" text-anchor="middle">已有：懂客户关系</text><text x="653" y="219" font-family="sans-serif" font-size="15" fill="#ea580c" text-anchor="middle">缺：交付到底的经验</text><text x="653" y="261" font-family="sans-serif" font-size="15" fill="#ea580c" text-anchor="middle">缺：上线后的兜底</text><text x="653" y="303" font-family="sans-serif" font-size="15" fill="#1e293b" text-anchor="middle">补：跟完一次上线</text><text x="400" y="398" font-family="sans-serif" font-size="14" fill="#64748b" text-anchor="middle">三条路都不完整，缺口不同，补法也不同</text></svg>