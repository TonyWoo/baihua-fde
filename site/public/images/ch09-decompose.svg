<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="#f5f8ff"/>
  <text x="400" y="40" font-size="20" font-weight="bold" fill="#2563eb" text-anchor="middle">把一句话拆成四件可验收的事</text>
  <rect x="240" y="58" width="320" height="54" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="400" y="92" font-size="15" font-weight="bold" fill="#ea580c" text-anchor="middle">厂长原话：让质检别再漏检</text>
  <line x1="115" y1="160" x2="115" y2="192" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="310" y1="160" x2="310" y2="192" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="505" y1="160" x2="505" y2="192" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="700" y1="160" x2="700" y2="192" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M400,112 L400,140 L115,140 L115,156" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M400,112 L400,140 L310,140 L310,156" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M400,112 L400,140 L505,140 L505,156" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M400,112 L400,140 L700,140 L700,156" fill="none" stroke="#2563eb" stroke-width="2"/>
  <rect x="30" y="196" width="170" height="120" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="226" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">检得出</text>
  <text x="115" y="256" font-size="13" fill="#334155" text-anchor="middle">缺陷类型先列全</text>
  <text x="115" y="282" font-size="13" fill="#334155" text-anchor="middle">第一版只做两类</text>
  <rect x="225" y="196" width="170" height="120" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="310" y="226" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">检得准</text>
  <text x="310" y="256" font-size="13" fill="#334155" text-anchor="middle">漏检率与误报率</text>
  <text x="310" y="282" font-size="13" fill="#334155" text-anchor="middle">都先量出基线</text>
  <rect x="420" y="196" width="170" height="120" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="505" y="226" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">检得完</text>
  <text x="505" y="256" font-size="13" fill="#334155" text-anchor="middle">节拍跟得上产线</text>
  <text x="505" y="282" font-size="13" fill="#334155" text-anchor="middle">不靠停线换准确</text>
  <rect x="615" y="196" width="170" height="120" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="700" y="226" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">有人管</text>
  <text x="700" y="256" font-size="13" fill="#334155" text-anchor="middle">误报谁来复核</text>
  <text x="700" y="282" font-size="13" fill="#334155" text-anchor="middle">漏检谁来追责</text>
  <text x="400" y="360" font-size="13" fill="#64748b" text-anchor="middle">拆不到这一层，目标就只是一句愿望，没法验收</text>
  <text x="400" y="388" font-size="13" fill="#64748b" text-anchor="middle">每一件都要能写成数字或明确动作</text>
</svg>
