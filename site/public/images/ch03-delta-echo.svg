<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="sans-serif">
<rect width="800" height="420" fill="#f5f8ff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker></defs>
<text x="400" y="40" font-size="20" font-weight="bold" fill="#2563eb" text-anchor="middle">Delta 加 Echo：Palantir 的双人组</text>
<text x="400" y="66" font-size="13" fill="#64748b" text-anchor="middle">一个人把东西做出来，一个人确认做的事是对的</text>
<rect x="40" y="100" width="320" height="170" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="200.0" y="151.0" font-size="17" fill="#1e3a5f" text-anchor="middle" font-weight="bold">Delta：FDSE 工程师</text>
<text x="200.0" y="177.0" font-size="14" fill="#1e3a5f" text-anchor="middle">摸数据、设计系统</text>
<text x="200.0" y="203.0" font-size="14" fill="#1e3a5f" text-anchor="middle">写代码、做集成、上线</text>
<text x="200.0" y="229.0" font-size="14" fill="#1e3a5f" text-anchor="middle">对“做得对”负责</text>
<rect x="440" y="100" width="320" height="170" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="600.0" y="151.0" font-size="17" fill="#1e3a5f" text-anchor="middle" font-weight="bold">Echo：部署策略师</text>
<text x="600.0" y="177.0" font-size="14" fill="#1e3a5f" text-anchor="middle">弄清客户真正的问题</text>
<text x="600.0" y="203.0" font-size="14" fill="#1e3a5f" text-anchor="middle">判断值不值得做</text>
<text x="600.0" y="229.0" font-size="14" fill="#1e3a5f" text-anchor="middle">摆平分歧、安排节奏</text>
<line x1="365" y1="170" x2="435" y2="170" stroke="#ea580c" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="400" y="155" font-size="13" fill="#ea580c" text-anchor="middle">天天对齐</text>
<rect x="190" y="310" width="420" height="56" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="400.0" y="343.0" font-size="15" fill="#ea580c" text-anchor="middle">共同目标：客户的问题被真正解决</text>
</svg>