<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470"><rect x="0" y="0" width="800" height="470" fill="#f5f8ff"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker></defs><text x="400" y="38" font-family="sans-serif" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="bold">90 天三线并行计划</text><rect x="30" y="58" width="90" height="54" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="75" y="91" font-family="sans-serif" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">线</text><rect x="130" y="58" width="210" height="54" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="235" y="91" font-family="sans-serif" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">第 1 到 30 天</text><rect x="350" y="58" width="210" height="54" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="455" y="91" font-family="sans-serif" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">第 31 到 60 天</text><rect x="570" y="58" width="210" height="54" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="675" y="91" font-family="sans-serif" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">第 61 到 90 天</text><rect x="30" y="122" width="90" height="90" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="75" y="174" font-family="sans-serif" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">技术线</text><rect x="130" y="122" width="210" height="90" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="235" y="160" font-family="sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">学数据管道与接口</text><text x="235" y="186" font-family="sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">补齐云上部署基础</text><rect x="350" y="122" width="210" height="90" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="45