<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310"><rect x="0" y="0" width="800" height="310" fill="#f5f8ff"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker></defs><text x="400" y="38" font-family="sans-serif" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="bold">三个检查点：拿作品说话</text><rect x="30" y="70" width="234" height="160" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="147" y="108" font-family="sans-serif" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">第 30 天</text><text x="147" y="148" font-family="sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">一个能跑的练习作品</text><text x="147" y="182" font-family="sans-serif" font-size="14" fill="#64748b" text-anchor="middle">会用，不求完整</text><line x1="268" y1="150" x2="279" y2="150" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/><rect x="283" y="70" width="234" height="160" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="400" y="108" font-family="sans-serif" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">第 60 天</text><text x="400" y="148" font-family="sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">带评估集的完整小应用</text><text x="400" y="182" font-family="sans-serif" font-size="14" fill="#64748b" text-anchor="middle">能证明效果好坏</text><line x1="521" y1="150" x2="532" y2="150" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/><rect x="536" y="70" width="234" height="160" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="653" y="108" font-family="sans-serif" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">第 90 天</text><text x="653" y="148" font-family="sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">一次真实场景交付记录</text><text x="653" y="182" font-family="sans-serif" font-size="14" fill="#64748b" text-anchor="middle">有人用，有反馈</text><text x="400" y="272" font-family="sans-serif" font-size="14" fill="#ea580c" text-anchor="middle">过不了检查点，先补课，不要急着投简历</text></svg>