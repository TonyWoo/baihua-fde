<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 395" width="800" height="395">
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker></defs>
<rect x="0" y="0" width="800" height="395" fill="#f5f8ff"/>
<text x="400.0" y="38" font-family="sans-serif" font-size="20" fill="#1e3a5f" text-anchor="middle" font-weight="bold">中国企业的三个特殊讲究</text>
<rect x="50" y="80" width="340" height="135" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
<text x="220.0" y="108" font-family="sans-serif" font-size="16" fill="#1e3a5f" text-anchor="middle" font-weight="bold">数据边界硬</text>
<text x="220.0" y="128" font-family="sans-serif" font-size="14" fill="#1e3a5f" text-anchor="middle" font-weight="normal">数据不出厂区、不出内网</text>
<text x="220.0" y="147" font-family="sans-serif" font-size="14" fill="#1e3a5f" text-anchor="middle" font-weight="normal">方案先按本地部署设计</text>
<rect x="410" y="80" width="340" height="135" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="580.0" y="108" font-family="sans-serif" font-size="16" fill="#1e3a5f" text-anchor="middle" font-weight="bold">系统环境杂</text>
<text x="580.0" y="128" font-family="sans-serif" font-size="14" fill="#1e3a5f" text-anchor="middle" font-weight="normal">老系统、国产化软件、手工台账</text>
<text x="580.0" y="147" font-family="sans-serif" font-size="14" fill="#1e3a5f" text-anchor="middle" font-weight="normal">同时存在，接口条件差</text>
<rect x="50" y="235" width="340" height="135" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="220.0" y="263" font-family="sans-serif" font-size="16" fill="#1e3a5f" text-anchor="middle" font-weight="bold">信任靠现场</text>
<text x="220.0" y="283" font-family="sans-serif" font-size="14" fill="#1e3a5f" text-anchor="middle" font-weight="normal">老师傅的经验在人身上</text>
<text x="220.0" y="302" font-family="sans-serif" font-size="14" fill="#1e3a5f" text-anchor="middle" font-weight="normal">肯不肯交，要靠相处验</text>
<rect x="410" y="235" width="340" height="135" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
<text x="580.0" y="263" font-family="sans-serif" font-size="16" fill="#1e3a5f" text-anchor="middle" font-weight="bold">顺序不能错</text>
<text x="580.0" y="283" font-family="sans-serif" font-size="14" fill="#1e3a5f" text-anchor="middle" font-weight="normal">先核对边界，再谈功能</text>
<text x="580.0" y="302" font-family="sans-serif" font-size="14" fill="#1e3a5f" text-anchor="middle" font-weight="normal">顺序错了，越专业越返工</text>
</svg>
