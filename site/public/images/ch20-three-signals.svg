<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="sans-serif">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker></defs>
<rect x="0" y="0" width="800" height="340" fill="#f5f8ff"/>
<text x="400" y="38" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="bold">要不要自建，先看三个信号</text><rect x="55" y="70" width="230" height="150" rx="6" fill="white" stroke="#2563eb" stroke-width="2"/><circle cx="170" cy="105" r="16" fill="#ea580c"/><text x="170" y="150" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">信号一</text><text x="170" y="180" font-size="15" fill="#1e293b" text-anchor="middle">场景源源不断</text><text x="170" y="205" font-size="13" fill="#64748b" text-anchor="middle">今年排得出 5 个以上场景</text><rect x="300" y="70" width="230" height="150" rx="6" fill="white" stroke="#2563eb" stroke-width="2"/><circle cx="415" cy="105" r="16" fill="#ea580c"/><text x="415" y="150" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">信号二</text><text x="415" y="180" font-size="15" fill="#1e293b" text-anchor="middle">数据和流程是家底</text><text x="415" y="205" font-size="13" fill="#64748b" text-anchor="middle">核心数据不适合长期给外人</text><rect x="545" y="70" width="230" height="150" rx="6" fill="white" stroke="#2563eb" stroke-width="2"/><circle cx="660" cy="105" r="16" fill="#ea580c"/><text x="660" y="150" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">信号三</text><text x="660" y="180" font-size="15" fill="#1e293b" text-anchor="middle">撤场后要有人接</text><text x="660" y="205" font-size="13" fill="#64748b" text-anchor="middle">系统要迭代三年以上</text><rect x="140" y="255" width="520" height="60" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="400" y="282" font-size="15" fill="#ea580c" text-anchor="middle" font-weight="bold">三个都中：自建小队，厂商转顾问</text><text x="400" y="305" font-size="13" fill="#64748b" text-anchor="middle">只中一个：先外购，别急着建队</text></svg>
