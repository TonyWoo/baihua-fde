<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" font-family="sans-serif">
  <rect width="800" height="390" fill="#f5f8ff"/>
  <text x="400" y="36" font-size="20" fill="#1e3a5f" text-anchor="middle" font-weight="bold">给厂长算账：一笔投入产出</text>
  <rect x="40" y="64" width="330" height="180" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="205" y="94" font-size="16" fill="#1e3a5f" text-anchor="middle" font-weight="bold">投入：钱花在哪</text>
  <g font-size="14" fill="#1e3a5f">
    <text x="65" y="130">小队 45 天驻场与开发</text>
    <text x="65" y="158">接口改造与算力费用</text>
    <text x="65" y="186">厂里配合人员的工时</text>
    <text x="65" y="214">上线后的运维与迭代</text>
  </g>
  <rect x="430" y="64" width="330" height="180" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="595" y="94" font-size="16" fill="#1e3a5f" text-anchor="middle" font-weight="bold">收益：钱省在哪</text>
  <g font-size="14" fill="#1e3a5f">
    <text x="455" y="130">漏检减少，少返工少索赔</text>
    <text x="455" y="158">故障早发现，少停机</text>
    <text x="455" y="186">全检改抽检，省人力</text>
    <text x="455" y="214">维修查资料，从半天到分钟</text>
  </g>
  <text x="400" y="150" font-size="20" fill="#64748b" text-anchor="middle">对</text>
  <rect x="130" y="278" width="540" height="62" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="304" font-size="15" fill="#1e3a5f" text-anchor="middle" font-weight="bold">回本周期 = 总投入 ÷ 每月净收益</text>
  <text x="400" y="328" font-size="13" fill="#64748b" text-anchor="middle">只给区间，不给假精确：按保守口径算完，还能回本才值得做</text>
  <text x="400" y="368" font-size="13" fill="#64748b" text-anchor="middle">账算不清的项目，多半是问题没选对，不是模型不够强</text>
</svg>
