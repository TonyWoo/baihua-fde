<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" font-family="sans-serif">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker></defs>
<rect x="0" y="0" width="800" height="370" fill="#f5f8ff"/>
<text x="400" y="36" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="bold">三种运营模型：从中央队到嵌入式小队</text><rect x="35" y="60" width="240" height="235" rx="6" fill="white" stroke="#2563eb" stroke-width="2"/><text x="155" y="92" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">模型一 中央平台队</text><text x="155" y="118" font-size="13" fill="#64748b" text-anchor="middle">总部一个队统管</text><text x="155" y="152" font-size="14" fill="#1e293b" text-anchor="middle">模型接入与网关</text><text x="155" y="180" font-size="14" fill="#1e293b" text-anchor="middle">评估与安全护栏</text><text x="155" y="208" font-size="14" fill="#1e293b" text-anchor="middle">统一工具平台</text><text x="155" y="275" font-size="13" fill="#ea580c" text-anchor="middle">毛病：容易变排队窗口</text><rect x="290" y="60" width="240" height="235" rx="6" fill="white" stroke="#2563eb" stroke-width="2"/><text x="410" y="92" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">模型二 中心辐射</text><text x="410" y="118" font-size="13" fill="#64748b" text-anchor="middle">总部定标准，各部门有 spoke</text><text x="410" y="152" font-size="14" fill="#1e293b" text-anchor="middle">总部管平台和标准</text><text x="410" y="180" font-size="14" fill="#1e293b" text-anchor="middle">业务部门有驻点工程师</text><text x="410" y="208" font-size="14" fill="#1e293b" text-anchor="middle">项目评审走同一道门</text><text x="410" y="275" font-size="13" fill="#ea580c" text-anchor="middle">毛病：标准容易漂移</text><rect x="545" y="60" width="240" height="235" rx="6" fill="white" stroke="#2563eb" stroke-width="2"/><text x="665" y="92" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">模型三 嵌入式 pod</text><text x="665" y="118" font-size="13" fill="#64748b" text-anchor="middle">小队常驻业务线</text><text x="665" y="152" font-size="14" fill="#1e293b" text-anchor="middle">FDE 加业务负责人</text><text x="665" y="180" font-size="14" fill="#1e293b" text-anchor="middle">平台联络人对接总部</text><text x="665" y="208" font-size="14" fill="#1e293b" text-anchor="middle">一个场景负责到底</text><text x="665" y="275" font-size="13" fill="#ea580c" text-anchor="middle">毛病：没平台托底会重复造轮子</text><line x1="180" y1="325" x2="620" y2="325" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/><text x="400" y="318" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">场景变多、业务变熟，组织就往右演进</text><text x="400" y="352" font-size="13" fill="#64748b" text-anchor="middle">多数企业不是三选一，是分阶段走完三步</text></svg>
