<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 385" font-family="sans-serif">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker></defs>
<rect x="0" y="0" width="800" height="385" fill="#f5f8ff"/>
<text x="400" y="38" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="bold">自建与外购的成本账：贵和便宜会换位</text><line x1="90" y1="70" x2="90" y2="330" stroke="#64748b" stroke-width="2"/><line x1="90" y1="330" x2="730" y2="330" stroke="#64748b" stroke-width="2"/><text x="90" y="360" font-size="13" fill="#64748b" text-anchor="middle">项目越做越多</text><text x="45" y="200" font-size="13" fill="#64748b" text-anchor="middle">累计花费</text><path d="M90,310 L700,90" fill="none" stroke="#ea580c" stroke-width="3"/><text x="640" y="70" font-size="14" fill="#ea580c" text-anchor="middle" font-weight="bold">外购：单价高，越买越贵</text><path d="M90,180 L260,165 L700,140" fill="none" stroke="#2563eb" stroke-width="3"/><text x="560" y="125" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">自建：先贵，后面每个项目都便宜</text><line x1="330" y1="150" x2="330" y2="330" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="330" y="352" font-size="13" fill="#ea580c" text-anchor="middle">交点：场景够多才划算</text><text x="200" y="300" font-size="13" fill="#64748b" text-anchor="middle">知识留在别人那里</text><text x="520" y="300" font-size="13" fill="#64748b" text-anchor="middle">知识留在自己厂里</text></svg>
