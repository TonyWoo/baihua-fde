<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="sans-serif">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker></defs>
<rect x="0" y="0" width="800" height="380" fill="#f5f8ff"/>
<text x="400" y="36" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="bold">职级薪酬不对标市场，天平会翻</text><line x1="400" y1="90" x2="400" y2="250" stroke="#64748b" stroke-width="3"/><line x1="180" y1="120" x2="620" y2="120" stroke="#64748b" stroke-width="3"/><path d="M120,120 L240,120 L180,180 Z" fill="none" stroke="#2563eb" stroke-width="2"/><path d="M560,120 L680,120 L620,180 Z" fill="none" stroke="#2563eb" stroke-width="2"/><text x="180" y="215" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">厂内老序列</text><text x="180" y="240" font-size="13" fill="#64748b" text-anchor="middle">稳定，但低于市场</text><text x="620" y="215" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">市场 FDE 行情</text><text x="620" y="240" font-size="13" fill="#64748b" text-anchor="middle">厂商和咨询公司在挖人</text><rect x="150" y="275" width="500" height="84" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="400" y="303" font-size="15" fill="#ea580c" text-anchor="middle" font-weight="bold">解法：单设 FDE 职级序列，全队按新序列定级</text><text x="400" y="330" font-size="13" fill="#64748b" text-anchor="middle">老员工补齐差距，不用同队两套价</text></svg>
