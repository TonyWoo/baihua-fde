<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 445" font-family="sans-serif">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker></defs>
<rect x="0" y="0" width="800" height="445" fill="#f5f8ff"/>
<text x="400" y="36" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="bold">汇报线决定这支队听谁的、为什么忙</text><rect x="280" y="60" width="240" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="400" y="94" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">分管生产的副厂长</text><line x1="400" y1="116" x2="400" y2="150" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/><rect x="280" y="152" width="240" height="56" rx="6" fill="white" stroke="#2563eb" stroke-width="2"/><text x="400" y="186" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="bold">内部 FDE 队（王工）</text><line x1="300" y1="208" x2="180" y2="252" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/><line x1="500" y1="208" x2="620" y2="252" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/><rect x="55" y="254" width="250" height="86" rx="6" fill="white" stroke="#2563eb" stroke-width="2"/><text x="180" y="282" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">虚线借力：总部信息部</text><text x="180" y="308" font-size="13" fill="#64748b" text-anchor="middle">平台、账号、数据接口</text><text x="180" y="328" font-size="13" fill="#64748b" text-anchor="middle">技术评审走这条线</text><rect x="495" y="254" width="250" height="86" rx="6" fill="white" stroke="#2563eb" stroke-width="2"/><text x="620" y="282" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">实线服务：各车间业务线</text><text x="620" y="308" font-size="13" fill="#64748b" text-anchor="middle">场景从这里来</text><text x="620" y="328" font-size="13" fill="#64748b" text-anchor="middle">成效由这里验收</text><rect x="140" y="372" width="520" height="54" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="400" y="396" font-size="14" fill="#ea580c" text-anchor="middle" font-weight="bold">挂信息部下面的下场：变成接工单的维修队</text><text x="400" y="417" font-size="13" fill="#64748b" text-anchor="middle">业务不认账，好手留不住</text></svg>
