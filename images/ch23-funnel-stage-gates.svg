<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="sans-serif">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker></defs>
<rect x="0" y="0" width="800" height="430" fill="#f5f8ff"/>
<text x="400" y="34" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="bold">场景漏斗加四道阶段门</text><polygon points="60,80 300,80 215,260 145,260" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><line x1="82" y1="140" x2="278" y2="140" stroke="#2563eb" stroke-width="1.5"/><line x1="104" y1="200" x2="256" y2="200" stroke="#2563eb" stroke-width="1.5"/><text x="180" y="118" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">部门报上来的场景</text><text x="180" y="178" font-size="14" fill="#1e293b" text-anchor="middle">过选题五条标准</text><text x="180" y="238" font-size="14" fill="#1e293b" text-anchor="middle">剩下的才立项</text><text x="180" y="292" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="bold">例：11 个报 3 个</text><rect x="360" y="70" width="390" height="58" rx="6" fill="white" stroke="#2563eb" stroke-width="2"/><text x="555" y="96" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">门一 立项门</text><text x="555" y="118" font-size="13" fill="#64748b" text-anchor="middle">价值和负责人说得清吗</text><line x1="555" y1="128" x2="555" y2="150" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/><rect x="360" y="152" width="390" height="58" rx="6" fill="white" stroke="#2563eb" stroke-width="2"/><text x="555" y="178" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">门二 入场门</text><text x="555" y="200" font-size="13" fill="#64748b" text-anchor="middle">真问题和图纸问题一样吗</text><line x1="555" y1="210" x2="555" y2="232" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/><rect x="360" y="234" width="390" height="58" rx="6" fill="white" stroke="#2563eb" stroke-width="2"/><text x="555" y="260" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">门三 交付门</text><text x="555" y="282" font-size="13" fill="#64748b" text-anchor="middle">评估达标、安全过审吗</text><line x1="555" y1="292" x2="555" y2="314" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/><rect x="360" y="316" width="390" height="58" rx="6" fill="white" stroke="#2563eb" stroke-width="2"/><text x="555" y="342" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">门四 移交门</text><text x="555" y="364" font-size="13" fill="#64748b" text-anchor="middle">留守物齐、接班人有吗</text><text x="555" y="410" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="bold">过不了门就停，停不是失败，是止损</text></svg>
