<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 425" font-family="sans-serif">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker></defs>
<rect x="0" y="0" width="800" height="425" fill="#f5f8ff"/>
<text x="400" y="36" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="bold">第一支小队的编制三角</text><polygon points="400,80 160,330 640,330" fill="none" stroke="#2563eb" stroke-width="2"/><circle cx="400" cy="80" r="8" fill="#ea580c"/><circle cx="160" cy="330" r="8" fill="#2563eb"/><circle cx="640" cy="330" r="8" fill="#2563eb"/><rect x="280" y="96" width="240" height="58" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="400" y="122" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">队长（王工）</text><text x="400" y="144" font-size="13" fill="#64748b" text-anchor="middle">懂业务，能写代码，能扛事</text><rect x="30" y="344" width="260" height="58" rx="6" fill="white" stroke="#2563eb" stroke-width="2"/><text x="160" y="370" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="bold">业务翻译官</text><text x="160" y="392" font-size="13" fill="#64748b" text-anchor="middle">把车间的话翻成需求</text><rect x="510" y="344" width="260" height="58" rx="6" fill="white" stroke="#2563eb" stroke-width="2"/><text x="640" y="370" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="bold">工程师加数据工程师</text><text x="640" y="392" font-size="13" fill="#64748b" text-anchor="middle">把需求做成能跑的系统</text><text x="400" y="240" font-size="15" fill="#ea580c" text-anchor="middle" font-weight="bold">缺任何一个角</text><text x="400" y="264" font-size="15" fill="#ea580c" text-anchor="middle" font-weight="bold">队伍都会瘸腿</text></svg>
