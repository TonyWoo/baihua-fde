<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="sans-serif">
<rect width="800" height="420" fill="#f5f8ff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker></defs>
<text x="400" y="40" font-size="20" font-weight="bold" fill="#2563eb" text-anchor="middle">Palantir 时间线：从人海前线到平台</text>
<text x="400" y="66" font-size="13" fill="#64748b" text-anchor="middle">先把人派进去，再把经验沉淀回来</text>
<line x1="45" y1="215" x2="755" y2="215" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
<circle cx="90" cy="215" r="8" fill="#ea580c"/>
<rect x="18" y="100" width="144" height="78" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="90.0" y="132.0" font-size="13" fill="#1e3a5f" text-anchor="middle">成立</text>
<text x="90.0" y="156.0" font-size="12" fill="#1e3a5f" text-anchor="middle">服务情报机构</text>
<line x1="90" y1="180" x2="90" y2="205" stroke="#64748b" stroke-width="2"/>
<text x="90" y="245" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">2003</text>
<circle cx="240" cy="215" r="8" fill="#ea580c"/>
<rect x="168" y="255" width="144" height="78" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="240.0" y="287.0" font-size="13" fill="#1e3a5f" text-anchor="middle">提出 FDE 一词</text>
<text x="240.0" y="311.0" font-size="12" fill="#1e3a5f" text-anchor="middle">CTO Sankar 的说法</text>
<line x1="240" y1="225" x2="240" y2="253" stroke="#64748b" stroke-width="2"/>
<text x="240" y="200" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">2007 年前后</text>
<circle cx="395" cy="215" r="8" fill="#ea580c"/>
<rect x="323" y="100" width="144" height="78" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="395.0" y="132.0" font-size="13" fill="#1e3a5f" text-anchor="middle">约 120 名 FDE</text>
<text x="395.0" y="156.0" font-size="12" fill="#1e3a5f" text-anchor="middle">模式成为主体</text>
<line x1="395" y1="180" x2="395" y2="205" stroke="#64748b" stroke-width="2"/>
<text x="395" y="245" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">2009</text>
<circle cx="550" cy="215" r="8" fill="#ea580c"/>
<rect x="478" y="255" width="144" height="78" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="550.0" y="287.0" font-size="13" fill="#1e3a5f" text-anchor="middle">FDE 多于</text>
<text x="550.0" y="311.0" font-size="12" fill="#1e3a5f" text-anchor="middle">普通软件工程师</text>
<line x1="550" y1="225" x2="550" y2="253" stroke="#64748b" stroke-width="2"/>
<text x="550" y="200" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">2016 年前</text>
<circle cx="695" cy="215" r="8" fill="#ea580c"/>
<rect x="623" y="100" width="144" height="78" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="695.0" y="132.0" font-size="13" fill="#1e3a5f" text-anchor="middle">Foundry 发布</text>
<text x="695.0" y="156.0" font-size="12" fill="#1e3a5f" text-anchor="middle">前线经验沉淀成平台</text>
<line x1="695" y1="180" x2="695" y2="205" stroke="#64748b" stroke-width="2"/>
<text x="695" y="245" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">2016</text>
<text x="400" y="385" font-size="14" fill="#64748b" text-anchor="middle">后来的 pod 小队编制，源头都在这条线上</text>
</svg>