<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="sans-serif">
<rect width="800" height="340" fill="#f5f8ff"/>
<defs>
<marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/>
</marker>
</defs>
<text x="40" y="42" font-size="20" fill="#1e40af">内建化：能力从厂商手里长回企业身上</text>
<line x1="60" y1="110" x2="740" y2="110" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
<circle cx="110" cy="110" r="8" fill="#2563eb"/>
<circle cx="320" cy="110" r="8" fill="#2563eb"/>
<circle cx="530" cy="110" r="8" fill="#2563eb"/>
<circle cx="700" cy="110" r="8" fill="#ea580c"/>
<rect x="25" y="140" width="180" height="110" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="115" y="170" font-size="15" fill="#0f172a" text-anchor="middle">厂商小队入驻</text>
<text x="115" y="196" font-size="13" fill="#64748b" text-anchor="middle">把第一个系统</text>
<text x="115" y="218" font-size="13" fill="#64748b" text-anchor="middle">推上生产</text>
<rect x="230" y="140" width="180" height="110" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="320" y="170" font-size="15" fill="#0f172a" text-anchor="middle">驻留带教</text>
<text x="320" y="196" font-size="13" fill="#64748b" text-anchor="middle">客户的人跟着做</text>
<text x="320" y="218" font-size="13" fill="#64748b" text-anchor="middle">边学边接手</text>
<rect x="440" y="140" width="180" height="110" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="530" y="170" font-size="15" fill="#0f172a" text-anchor="middle">企业自建队</text>
<text x="530" y="196" font-size="13" fill="#64748b" text-anchor="middle">日常场景自己接</text>
<text x="530" y="218" font-size="13" fill="#64748b" text-anchor="middle">标准活内部消化</text>
<rect x="615" y="140" width="170" height="110" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
<text x="700" y="170" font-size="15" fill="#ea580c" text-anchor="middle">外援只评难题</text>
<text x="700" y="196" font-size="13" fill="#64748b" text-anchor="middle">厂商退到顾问位</text>
<text x="700" y="218" font-size="13" fill="#64748b" text-anchor="middle">按需请，不常驻</text>
<text x="400" y="292" font-size="13" fill="#64748b" text-anchor="middle">Anthropic 的 Frontier Academy 训的正是客户和伙伴的人，走的就是这条路。</text>
<text x="400" y="316" font-size="13" fill="#64748b" text-anchor="middle">这说明厂商也认了：人不可能永远派下去，能力终归要长在客户身上。</text>
</svg>
