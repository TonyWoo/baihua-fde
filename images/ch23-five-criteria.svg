<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="sans-serif">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker></defs>
<rect x="0" y="0" width="800" height="420" fill="#f5f8ff"/>
<text x="400" y="36" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="bold">选题五条标准：每条都要能打钩</text><rect x="90" y="64" width="620" height="52" rx="6" fill="white" stroke="#2563eb" stroke-width="2"/><circle cx="125" cy="90" r="13" fill="#2563eb"/><text x="125" y="95" font-size="14" fill="white" text-anchor="middle" font-weight="bold">1</text><text x="160" y="96" font-size="15" fill="#1e293b" text-anchor="start" font-weight="bold">价值可衡量</text><text x="330" y="96" font-size="14" fill="#64748b" text-anchor="start">做完省几小时、少几次停机，先写下来</text><rect x="90" y="128" width="620" height="52" rx="6" fill="white" stroke="#2563eb" stroke-width="2"/><circle cx="125" cy="154" r="13" fill="#2563eb"/><text x="125" y="159" font-size="14" fill="white" text-anchor="middle" font-weight="bold">2</text><text x="160" y="160" font-size="15" fill="#1e293b" text-anchor="start" font-weight="bold">数据够得着</text><text x="330" y="160" font-size="14" fill="#64748b" text-anchor="start">数据在系统里，不靠人工临时凑</text><rect x="90" y="192" width="620" height="52" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><circle cx="125" cy="218" r="13" fill="#2563eb"/><text x="125" y="223" font-size="14" fill="white" text-anchor="middle" font-weight="bold">3</text><text x="160" y="224" font-size="15" fill="#1e293b" text-anchor="start" font-weight="bold">负责人共担</text><text x="330" y="224" font-size="14" fill="#64748b" text-anchor="start">业务负责人出人出时间，不只出嘴</text><rect x="90" y="256" width="620" height="52" rx="6" fill="white" stroke="#2563eb" stroke-width="2"/><circle cx="125" cy="282" r="13" fill="#2563eb"/><text x="125" y="287" font-size="14" fill="white" text-anchor="middle" font-weight="bold">4</text><text x="160" y="288" font-size="15" fill="#1e293b" text-anchor="start" font-weight="bold">一周期上生产</text><text x="330" y="288" font-size="14" fill="#64748b" text-anchor="start">约 12 周内能上线，不拖成年项目</text><rect x="90" y="320" width="620" height="52" rx="6" fill="white" stroke="#2563eb" stroke-width="2"/><circle cx="125" cy="346" r="13" fill="#2563eb"/><text x="125" y="351" font-size="14" fill="white" text-anchor="middle" font-weight="bold">5</text><text x="160" y="352" font-size="15" fill="#1e293b" text-anchor="start" font-weight="bold">做完可复制</text><text x="330" y="352" font-size="14" fill="#64748b" text-anchor="start">隔壁车间、隔壁产线能接着用</text><text x="400" y="396" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="bold">五条缺一条，先补课再立项；缺两条，直接砍</text></svg>
