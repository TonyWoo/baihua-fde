<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
  <rect width="800" height="450" fill="#f5f8ff"/>
  <text x="400" y="34" font-size="20" fill="#1e3a5f" text-anchor="middle" font-weight="bold">临江精工的小队编制：三加二</text>
  <rect x="265" y="52" width="270" height="48" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="82" font-size="15" fill="#1e3a5f" text-anchor="middle" font-weight="bold">共同目标：45 天把试点推上生产</text>
  <g stroke="#64748b" stroke-width="2">
    <line x1="330" y1="100" x2="145" y2="138"/>
    <line x1="400" y1="100" x2="400" y2="138"/>
    <line x1="470" y1="100" x2="655" y2="138"/>
  </g>
  <g font-size="14" fill="#1e3a5f">
    <rect x="30" y="140" width="230" height="112" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="145" y="168" text-anchor="middle" font-weight="bold">陆远：FDE 负责人</text>
    <text x="145" y="194" text-anchor="middle">拆题与技术决策</text>
    <text x="145" y="218" text-anchor="middle">对外汇报，对结果负责</text>
    <rect x="285" y="140" width="230" height="112" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="400" y="168" text-anchor="middle" font-weight="bold">小柯：工程师</text>
    <text x="400" y="194" text-anchor="middle">数据管道、模型、接口</text>
    <text x="400" y="218" text-anchor="middle">少开会，保深度工作</text>
    <rect x="540" y="140" width="230" height="112" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="655" y="168" text-anchor="middle" font-weight="bold">老潘：部署策略师</text>
    <text x="655" y="194" text-anchor="middle">访谈、流程、推进</text>
    <text x="655" y="218" text-anchor="middle">培训客户接班人</text>
  </g>
  <rect x="120" y="292" width="560" height="96" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="400" y="318" font-size="14" fill="#64748b" text-anchor="middle">客户侧搭档（不在编制内，缺了跑不动）</text>
  <g font-size="14" fill="#1e3a5f">
    <rect x="150" y="330" width="230" height="44" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="265" y="358" text-anchor="middle">王工：出题、验收、接班</text>
    <rect x="420" y="330" width="230" height="44" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="535" y="358" text-anchor="middle">厂长：拍板、给资源</text>
  </g>
  <g stroke="#64748b" stroke-width="2">
    <line x1="145" y1="252" x2="220" y2="288"/>
    <line x1="655" y1="252" x2="580" y2="288"/>
  </g>
  <text x="400" y="424" font-size="13" fill="#64748b" text-anchor="middle">厂商侧三人加客户侧两人，五个人才凑齐一个能落地的 pod</text>
</svg>
