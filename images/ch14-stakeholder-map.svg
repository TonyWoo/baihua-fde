<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="sans-serif">
  <rect width="800" height="430" fill="#f5f8ff"/>
  <text x="400" y="34" font-size="20" fill="#1e3a5f" text-anchor="middle" font-weight="bold">利益地图：每个人在担心什么</text>
  <g stroke="#64748b" stroke-width="2">
    <line x1="400" y1="122" x2="400" y2="196"/>
    <line x1="222" y1="224" x2="306" y2="224"/>
    <line x1="494" y1="224" x2="578" y2="224"/>
    <line x1="330" y1="252" x2="255" y2="312"/>
    <line x1="470" y1="252" x2="545" y2="312"/>
  </g>
  <g font-size="14" fill="#1e3a5f">
    <rect x="310" y="62" width="180" height="60" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="400" y="88" text-anchor="middle" font-weight="bold">厂长</text>
    <text x="400" y="110" text-anchor="middle">要交期，要良率数字</text>
    <rect x="310" y="196" width="180" height="56" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="400" y="230" text-anchor="middle" font-weight="bold">AI 质检加维修助手</text>
    <rect x="42" y="196" width="180" height="56" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="132" y="222" text-anchor="middle" font-weight="bold">IT 负责人</text>
    <text x="132" y="244" text-anchor="middle">怕数据出事、怕背锅</text>
    <rect x="578" y="196" width="180" height="56" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="668" y="222" text-anchor="middle" font-weight="bold">车间主任</text>
    <text x="668" y="244" text-anchor="middle">怕添乱、怕数据拿去考核</text>
    <rect x="165" y="314" width="180" height="56" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="255" y="340" text-anchor="middle" font-weight="bold">王工</text>
    <text x="255" y="362" text-anchor="middle">想把事做成，缺人手</text>
    <rect x="455" y="314" width="180" height="56" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="545" y="340" text-anchor="middle" font-weight="bold">质检组长</text>
    <text x="545" y="362" text-anchor="middle">怕被机器替代</text>
  </g>
  <text x="400" y="408" font-size="13" fill="#64748b" text-anchor="middle">先找到最顾虑的人：他的担心，往往就是项目真正的风险</text>
</svg>
