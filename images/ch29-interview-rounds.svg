<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330"><rect x="0" y="0" width="800" height="330" fill="#f5f8ff"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker></defs><text x="400" y="38" font-family="sans-serif" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="bold">面试三轮，一条线</text><rect x="30" y="70" width="234" height="180" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="147" y="110" font-family="sans-serif" font-size="15" fill="#64748b" text-anchor="middle">第一轮</text><text x="147" y="145" font-family="sans-serif" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="bold">问题拆解</text><text x="147" y="190" font-family="sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">把含糊问题问清拆细</text><line x1="268" y1="160" x2="279" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/><rect x="283" y="70" width="234" height="180" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="400" y="110" font-family="sans-serif" font-size="15" fill="#64748b" text-anchor="middle">第二轮</text><text x="400" y="145" font-family="sans-serif" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="bold">编码</text><text x="400" y="190" font-family="sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">写得出能跑的代码</text><line x1="521" y1="160" x2="532" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/><rect x="536" y="70" width="234" height="180" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="653" y="110" font-family="sans-serif" font-size="15" fill="#64748b" text-anchor="middle">第三轮</text><text x="653" y="145" font-family="sans-serif" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="bold">客户场景</text><text x="653" y="190" font-family="sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">当面沟通与临场应变</text><text x="400" y="295" font-family="sans-serif" font-size="14" fill="#64748b" text-anchor="middle">三轮考的是同一件事：能不能把事做成</text></svg>