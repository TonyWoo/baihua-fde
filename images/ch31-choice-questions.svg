<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350"><rect x="0" y="0" width="800" height="350" fill="#f5f8ff"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker></defs><text x="400" y="38" font-family="sans-serif" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="bold">选雇主之前，先答四个问题</text><rect x="24" y="80" width="178" height="130" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="113" y="128" font-family="sans-serif" font-size="13" fill="#64748b" text-anchor="middle">问题 1</text><text x="113" y="162" font-family="sans-serif" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">想离技术多近</text><line x1="205" y1="145" x2="214" y2="145" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/><rect x="216" y="80" width="178" height="130" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="305" y="128" font-family="sans-serif" font-size="13" fill="#64748b" text-anchor="middle">问题 2</text><text x="305" y="162" font-family="sans-serif" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">能接受多少出差</text><line x1="397" y1="145" x2="406" y2="145" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/><rect x="408" y="80" width="178" height="130" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="497" y="128" font-family="sans-serif" font-size="13" fill="#64748b" text-anchor="middle">问题 3</text><text x="497" y="162" font-family="sans-serif" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">要稳定还是成长速度</text><line x1="589" y1="145" x2="598" y2="145" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/><rect x="600" y="80" width="178" height="130" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="689" y="128" font-family="sans-serif" font-size="13" fill="#64748b" text-anchor="middle">问题 4</text><text x="689" y="162" font-family="sans-serif" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">想深耕哪个行业</text><text x="400" y="258" font-family="sans-serif" font-size="14" fill="#ea580c" text-anchor="middle">四个答案连起来，就是你的投递名单</text><text x="400" y="292" font-family="sans-serif" font-size="13" fill="#64748b" text-anchor="middle">名单列好之后，再去看每家的具体岗位要求</text></svg>