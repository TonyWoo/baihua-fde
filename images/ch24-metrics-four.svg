<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" font-family="sans-serif">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker></defs>
<rect x="0" y="0" width="800" height="410" fill="#f5f8ff"/>
<text x="400" y="36" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="bold">度量四件套：复盘只看这四样</text><rect x="60" y="70" width="325" height="130" rx="6" fill="white" stroke="#2563eb" stroke-width="2"/><text x="222" y="112" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="bold">上生产率</text><text x="222" y="146" font-size="14" fill="#1e293b" text-anchor="middle">立项里有几成真上线</text><text x="222" y="174" font-size="13" fill="#ea580c" text-anchor="middle">不用演示版充数</text><rect x="415" y="70" width="325" height="130" rx="6" fill="white" stroke="#2563eb" stroke-width="2"/><text x="577" y="112" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="bold">见效周期</text><text x="577" y="146" font-size="14" fill="#1e293b" text-anchor="middle">从立项到见效多少周</text><text x="577" y="174" font-size="13" fill="#ea580c" text-anchor="middle">越短说明选题越准</text><rect x="60" y="225" width="325" height="130" rx="6" fill="white" stroke="#2563eb" stroke-width="2"/><text x="222" y="267" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="bold">业务指标</text><text x="222" y="301" font-size="14" fill="#1e293b" text-anchor="middle">停机、误报、盘点耗时</text><text x="222" y="329" font-size="13" fill="#ea580c" text-anchor="middle">钱和时间要能对上账</text><rect x="415" y="225" width="325" height="130" rx="6" fill="white" stroke="#2563eb" stroke-width="2"/><text x="577" y="267" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="bold">复用率</text><text x="577" y="301" font-size="14" fill="#1e293b" text-anchor="middle">新项目用了多少老组件</text><text x="577" y="329" font-size="13" fill="#ea580c" text-anchor="middle">越高说明底座越厚</text><text x="400" y="392" font-size="13" fill="#64748b" text-anchor="middle">只报调用量和上线个数，年底预算一定被砍</text></svg>
