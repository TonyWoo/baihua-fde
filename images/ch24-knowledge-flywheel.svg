<text x="400" y="36" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="bold">留守物回流：项目越做，底座越厚</text><circle cx="400" cy="215" r="118" fill="none" stroke="#2563eb" stroke-width="2"/><line x1="478" y1="128" x2="540" y2="180" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/><line x1="500" y1="300" x2="420" y2="330" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/><line x1="268" y1="300" x2="262" y2="190" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/><line x1="300" y1="118" x2="392" y2="100" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/><rect x="300" y="60" width="200" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="400" y="92" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">业务项目交付</text><rect x="520" y="190" width="230" height="52" rx="6" fill="white" stroke="#2563eb" stroke-width="2"/><text x="635" y="222" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="bold">留守物回流平台层</text><rect x="300" y="318" width="200" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="400" y="350" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">组件和评估集入库</text><rect x="50" y="190" width="230" height="52" rx="6" fill="white" stroke="#2563eb" stroke-width="2"/><text x="165" y="222" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="bold">下个项目直接复用</text><text x="400" y="208" font-size="15" fill="#ea580c" text-anchor="middle" font-weight="bold">内部版</text><text x="400" y="232" font-size="15" fill="#ea580c" text-anchor="middle" font-weight="bold">Foundry 回路</text><text x="400" y="392" font-size="13" fill="#64748b" text-anchor="middle">经验长在平台上，不长在某个人脑子里</text></svg>
