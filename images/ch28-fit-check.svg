<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400"><rect x="0" y="0" width="800" height="400" fill="#f5f8ff"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker></defs><text x="400" y="38" font-family="sans-serif" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="bold">适合的信号，别来的信号</text><rect x="30" y="60" width="360" height="270" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="210" y="95" font-family="sans-serif" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="bold">适合的信号</text><text x="210" y="135" font-family="sans-serif" font-size="15" fill="#1e293b" text-anchor="middle">喜欢没有标准答案的问题</text><text x="210" y="175" font-family="sans-serif" font-size="15" fill="#1e293b" text-anchor="middle">愿意跑到现场看真实流程</text><text x="210" y="215" font-family="sans-serif" font-size="15" fill="#1e293b" text-anchor="middle">能对结果负责到底</text><text x="210" y="255" font-family="sans-serif" font-size="15" fill="#1e293b" text-anchor="middle">进新行业不怵，学得快</text><text x="210" y="295" font-family="sans-serif" font-size="15" fill="#1e293b" text-anchor="middle">跟客户说话不绕弯</text><rect x="410" y="60" width="360" height="270" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="2"/><text x="590" y="95" font-family="sans-serif" font-size="17" fill="#ea580c" text-anchor="middle" font-weight="bold">别来的信号</text><text x="590" y="135" font-family="sans-serif" font-size="15" fill="#1e293b" text-anchor="middle">只想安静写代码不理人</text><text x="590" y="175" font-family="sans-serif" font-size="15" fill="#1e293b" text-anchor="middle">受不了频繁出差</text><text x="590" y="215" font-family="sans-serif" font-size="15" fill="#1e293b" text-anchor="middle">怕跟客户当面争论</text><text x="590" y="255" font-family="sans-serif" font-size="15" fill="#1e293b" text-anchor="middle">只盯着薪资数字选工作</text><text x="590" y="295" font-family="sans-serif" font-size="15" fill="#1e293b" text-anchor="middle">出问题第一反应找借口</text><text x="400" y="368" font-family="sans-serif" font-size="14" fill="#64748b" text-anchor="middle">对上三条别来信号，先别投，投了也难受</text></svg>